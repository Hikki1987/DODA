# Render.com Blueprint — free-tier MVP deploy (no credit card required).
#
# HONEST LIMITATION: this file is written from well-established,
# long-stable knowledge of Render's Blueprint format, NOT verified
# against Render's current docs or API — this session's network policy
# blocks render.com entirely (confirmed: even Anthropic's own WebFetch
# tool got EGRESS_BLOCKED fetching render.com and, as a sanity check,
# plain en.wikipedia.org too — this is a blanket policy, not something
# specific to Render). If Render's dashboard rejects a field name here,
# that is the most likely reason, not a deeper problem — see
# deploy/README.md's manual fallback steps for exactly this case.
#
# Scope of this free deploy: Postgres + the API service + the frontend.
# Deliberately NOT included: Redis, outbox-relay, telegram-relay — Render
# has no free Redis tier, and nothing on the request path needs Redis to
# be reachable (main.py/the FastAPI app never touches it — only the two
# relay worker processes do, see tests/unit/test_side_effect_boundary.py's
# own comment on this). So login, workspaces, tasks, actions-without-a-
# connector, audit, kill switch — the whole MVP except actually sending a
# Telegram message — all work with no Redis at all.
databases:
  - name: doda-postgres
    plan: free
    databaseName: doda
    user: doda

services:
  - type: web
    name: doda-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /v1/healthz
    # Render provides $PORT at runtime and requires the service to bind
    # to it — backend/Dockerfile's own CMD hardcodes 8000, so this
    # overrides it. Also runs the migration that elsewhere
    # (docker-compose.prod.yml) is its own one-shot `migrate` service —
    # Render's free tier has no separate one-off job primitive, so it
    # runs here, before the server starts, on every deploy (safe: Alembic
    # migrations are themselves idempotent/no-ops once already applied).
    #
    # Two different inline `sh -c "..."` / `sh -c '...'` quotings both
    # failed on a real Render deploy (exit 127, the whole command line
    # looked up as one literal name instead of being shell-parsed) —
    # whatever Render's exact string-parsing rule is, it doesn't survive
    # a shell operator embedded in this field. A single space-free path to
    # a real script removes the ambiguity entirely: nothing left for
    # Render to mis-split. See backend/docker-entrypoint.sh.
    dockerCommand: ./docker-entrypoint.sh
    envVars:
      - key: DODA_ENV
        value: production
      - key: DODA_DATABASE_URL
        fromDatabase:
          name: doda-postgres
          property: connectionString
      - key: DODA_MIGRATION_DATABASE_URL
        fromDatabase:
          name: doda-postgres
          property: connectionString
      - key: DODA_CORS_ALLOWED_ORIGINS
        value: https://doda-frontend.onrender.com
      - key: DODA_FRONTEND_BASE_URL
        value: https://doda-frontend.onrender.com
      - key: DODA_GOOGLE_OAUTH_REDIRECT_URI
        value: https://doda-backend.onrender.com/v1/auth/google/callback
      - key: DODA_GOOGLE_OAUTH_CLIENT_ID
        value: 486151726620-h39q5r8lt5neplnh83t7t9o5ac3ah9di.apps.googleusercontent.com
      # sync: false = Render prompts for this in its dashboard instead of
      # reading a value from this file — this is how a secret stays out
      # of the repo. Fill it in AFTER the Blueprint creates the service;
      # never put the real value here.
      - key: DODA_GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: DODA_TELEGRAM_BOT_TOKEN
        sync: false

  - type: web
    name: doda-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      # NEXT_PUBLIC_API_BASE_URL must be a Docker BUILD ARG (see
      # frontend/Dockerfile's own comment — Next.js inlines NEXT_PUBLIC_*
      # at build time, a runtime env var has no effect on an already-
      # built page). Whether render.yaml can set a Docker build arg via
      # envVars the same way it sets a runtime env var is exactly the
      # kind of Render-schema detail this file can't verify right now —
      # if the deployed frontend calls the wrong backend URL, this is the
      # first thing to check, and deploy/README.md's manual fallback
      # says precisely where to set it by hand in Render's dashboard.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://doda-backend.onrender.com
