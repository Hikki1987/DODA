[project]
name = "doda"
version = "0.1.0"
description = "DODA — Personal AI Operating System (backend, modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "prometheus-fastapi-instrumentator>=7.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A single event loop for the whole test session, matching the lifetime of
# the module-level engine in doda.db — otherwise asyncpg connections bound
# to one per-test loop get reused from a later test's different loop and
# blow up with "Future attached to a different loop".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
source = ["doda"]
# MANDATORY for this codebase, not a tuning knob: without greenlet+thread
# tracing, coverage silently misses code executed inside SQLAlchemy's
# greenlet bridge and the async request path, and every FastAPI route
# handler body reads as unexecuted. Measured: api/tasks.py reported 72%
# with tests that demonstrably exercise those exact lines, and 97% once
# this is set — a ~25-point error, in the direction that invents phantom
# test gaps (and would excuse real ones as "probably just the artifact").
concurrency = ["thread", "greenlet"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
# Alembic generates each revision file from its own fixed template (Union/
# Sequence imports included) and CLAUDE.md's master instruction forbids
# touching migration history — reformatting or import-sorting them is
# needless, blast-radius-only-downside churn on files nobody hand-maintains.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # long lines already wrapped for readability by hand; not worth auto-splitting
    "B008",  # Depends()/Path()/Query() in defaults is FastAPI's own required idiom, not a real bug
]

[tool.mypy]
python_version = "3.12"
plugins = ["sqlalchemy.ext.mypy.plugin"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
