name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a still-running CI run for the same branch/PR when a newer commit
# lands — without this, several quick pushes in a row (e.g. iterating on a
# CI fix) queue up and burn runner minutes finishing runs whose result no
# longer matters once a newer commit's run exists.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  # Admin/bootstrap role — Alembic only (CREATE EXTENSION, arbitrary DDL).
  DODA_MIGRATION_DATABASE_URL: postgresql+asyncpg://doda:doda@localhost:5432/doda
  # App runtime — the unprivileged role (ADR-005). Provisioned by the
  # "Create least-privilege app role" step below before anything reads it.
  DODA_DATABASE_URL: postgresql+asyncpg://doda_app:doda_app@localhost:5432/doda
  DODA_REDIS_URL: redis://localhost:6379/0

jobs:
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy
        run: mypy src/doda

  frontend-quality:
    name: Frontend lint + types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Generate route types
        # tsc alone doesn't know about Next's own generated types (e.g.
        # LayoutProps<'/'>) — those only exist after typegen/build/dev has
        # run once. Without this step tsc fails on a clean checkout even
        # though the exact same command passes locally once a dev server
        # has been run there.
        run: npx next typegen
      - name: TypeScript
        run: npx tsc --noEmit

  security-scan:
    name: Secret scan + dependency audit (NFR-SEC-002/003)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks secret scan
        # Pinned binary release rather than gitleaks/gitleaks-action, which
        # gates on a license key for GitHub Organization-owned repos — the
        # CLI itself is plain MIT-licensed and needs no key. Verified
        # locally against this exact repo history before pinning: v8.21.2
        # finds 0 leaks.
        #
        # working-directory: . — the workflow's default working-directory
        # is "backend" (see `defaults` above); this step must run from the
        # repo root or it would only ever scan backend/, silently missing
        # frontend/, .github/, and every root-level file.
        working-directory: .
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --verbose
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pip-audit (backend dependency CVEs)
        run: pip-audit
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: npm audit (frontend dependency CVEs, high + critical)
        working-directory: frontend
        # moderate/low findings are tracked via Dependabot, not a CI gate —
        # matches NFR-SEC-003's "Critical CVE 0; high <=7 kun ichida", which
        # only names critical/high as build-blocking.
        run: npm audit --audit-level=high

  migrations:
    name: Migration round-trip (upgrade / downgrade / upgrade)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: doda
          POSTGRES_PASSWORD: doda
          POSTGRES_DB: doda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Downgrade to base
        run: alembic downgrade base
      - name: Upgrade to head again
        run: alembic upgrade head

  test:
    name: Test suite (real Postgres + Redis)
    runs-on: ubuntu-latest
    needs: migrations
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: doda
          POSTGRES_PASSWORD: doda
          POSTGRES_DB: doda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Apply migrations (as admin role)
        run: alembic upgrade head
      - name: Create least-privilege app role
        # Service containers start before checkout, so they can't mount
        # this repo file directly the way docker-compose's local postgres
        # does — apply it explicitly instead, as the same admin role.
        run: PGPASSWORD=doda psql -h localhost -U doda -d doda -f ../infra/postgres-init/01-create-app-role.sql
      - name: Run test suite (as the unprivileged app role — proves RLS for real)
        run: pytest tests/ -v

  e2e:
    name: End-to-end (Playwright, real backend + frontend)
    runs-on: ubuntu-latest
    needs: migrations
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: doda
          POSTGRES_PASSWORD: doda
          POSTGRES_DB: doda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DODA_CORS_ALLOWED_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Apply migrations (as admin role)
        run: alembic upgrade head
      - name: Create least-privilege app role
        run: PGPASSWORD=doda psql -h localhost -U doda -d doda -f ../infra/postgres-init/01-create-app-role.sql
      - name: Start backend
        # health_router is mounted with prefix="/v1" (see main.py) — the
        # real path is /v1/healthz, not /healthz.
        run: |
          nohup uvicorn doda.main:app --port 8000 > /tmp/backend.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/v1/healthz > /dev/null && exit 0
            sleep 1
          done
          echo "backend never became healthy" && cat /tmp/backend.log && exit 1
      - name: Seed E2E demo data (independent seeds per spec file)
        # A single shared seed would let one spec's side effects (the
        # customer spec engages a kill switch, which broadcasts a
        # SECURITY_ALERT notification to every member) leak into the
        # other spec's assertions — see e2e/customer.spec.ts's comment.
        run: |
          python scripts/seed_e2e_demo.py --prefix E2E_ >> "$GITHUB_ENV"
          python scripts/seed_e2e_demo.py --prefix E2E_CUSTOMER_ >> "$GITHUB_ENV"
          python scripts/seed_e2e_demo.py --prefix E2E_A11Y_ >> "$GITHUB_ENV"
          python scripts/seed_e2e_demo.py --prefix E2E_ARCHIVE_ >> "$GITHUB_ENV"
          python scripts/seed_e2e_demo.py --prefix E2E_KILLSWITCH_ >> "$GITHUB_ENV"
          python scripts/seed_e2e_demo.py --prefix E2E_LOGOUT_ >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright's Chromium
        working-directory: frontend
        # --with-deps runs `apt-get update` under the hood, which refreshes
        # every apt source configured on the runner image -- including a
        # pre-installed Google Chrome repo we don't need (we only want
        # Chromium). That repo's mirror has intermittently served a
        # Release/Packages.gz pair that fail apt's hash check ("Hash Sum
        # mismatch"), which is entirely external and unrelated to this
        # project, but still aborts the whole install step. Retry a few
        # times with a short backoff rather than failing the whole job on
        # a transient upstream mirror inconsistency.
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "playwright install attempt $attempt failed, retrying..." >&2
            sleep 10
          done
          echo "playwright install failed after 3 attempts" >&2
          exit 1
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm run start > /tmp/frontend.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3000/login > /dev/null && exit 0
            sleep 1
          done
          echo "frontend never became healthy" && cat /tmp/frontend.log && exit 1
      - name: Run Playwright E2E suite
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7
