name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: backend

env:
  # Admin/bootstrap role — Alembic only (CREATE EXTENSION, arbitrary DDL).
  DODA_MIGRATION_DATABASE_URL: postgresql+asyncpg://doda:doda@localhost:5432/doda
  # App runtime — the unprivileged role (ADR-005). Provisioned by the
  # "Create least-privilege app role" step below before anything reads it.
  DODA_DATABASE_URL: postgresql+asyncpg://doda_app:doda_app@localhost:5432/doda
  DODA_REDIS_URL: redis://localhost:6379/0

jobs:
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy
        run: mypy src/doda

  frontend-quality:
    name: Frontend lint + types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Generate route types
        # tsc alone doesn't know about Next's own generated types (e.g.
        # LayoutProps<'/'>) — those only exist after typegen/build/dev has
        # run once. Without this step tsc fails on a clean checkout even
        # though the exact same command passes locally once a dev server
        # has been run there.
        run: npx next typegen
      - name: TypeScript
        run: npx tsc --noEmit

  migrations:
    name: Migration round-trip (upgrade / downgrade / upgrade)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: doda
          POSTGRES_PASSWORD: doda
          POSTGRES_DB: doda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Downgrade to base
        run: alembic downgrade base
      - name: Upgrade to head again
        run: alembic upgrade head

  test:
    name: Test suite (real Postgres + Redis)
    runs-on: ubuntu-latest
    needs: migrations
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: doda
          POSTGRES_PASSWORD: doda
          POSTGRES_DB: doda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Apply migrations (as admin role)
        run: alembic upgrade head
      - name: Create least-privilege app role
        # Service containers start before checkout, so they can't mount
        # this repo file directly the way docker-compose's local postgres
        # does — apply it explicitly instead, as the same admin role.
        run: PGPASSWORD=doda psql -h localhost -U doda -d doda -f ../infra/postgres-init/01-create-app-role.sql
      - name: Run test suite (as the unprivileged app role — proves RLS for real)
        run: pytest tests/ -v
