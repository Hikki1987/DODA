name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: backend

env:
  DODA_DATABASE_URL: postgresql+asyncpg://doda:doda@localhost:5432/doda
  DODA_REDIS_URL: redis://localhost:6379/0

jobs:
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy
        run: mypy src/doda

  migrations:
    name: Migration round-trip (upgrade / downgrade / upgrade)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: doda
          POSTGRES_PASSWORD: doda
          POSTGRES_DB: doda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Downgrade to base
        run: alembic downgrade base
      - name: Upgrade to head again
        run: alembic upgrade head

  test:
    name: Test suite (real Postgres + Redis)
    runs-on: ubuntu-latest
    needs: migrations
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: doda
          POSTGRES_PASSWORD: doda
          POSTGRES_DB: doda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run test suite
        run: pytest tests/ -v
