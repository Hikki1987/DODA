services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: doda
      POSTGRES_PASSWORD: doda
      POSTGRES_DB: doda
    ports:
      - "5432:5432"
    volumes:
      - doda_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doda"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  object-storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: doda
      MINIO_ROOT_PASSWORD: doda12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - doda_object_storage_data:/data

volumes:
  doda_postgres_data:
  doda_object_storage_data:
